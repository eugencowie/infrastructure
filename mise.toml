[settings]
disable_backends = ["asdf"] # cannot be updated by Renovate

[tools]
terraform = "latest"

[tasks."repos:init"]
description = "Initialise repos state"
dir = "repos"
run = "terraform init"

[tasks."repos:fmt"]
description = "Format repos configuration"
dir = "repos"
run = "terraform fmt"

[tasks."repos:plan"]
description = "Plan repos changes"
dir = "repos"
run = "terraform plan"

[tasks."repos:apply"]
description = "Apply repos changes"
dir = "repos"
run = "terraform apply"

[tasks."repos:adopt"]
description = "Adopt an existing repo"
dir = "repos"
run = "../scripts/adopt-repo.sh"

