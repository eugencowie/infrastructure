[tools]
jactionlint = "latest"
shellcheck = "latest"
terraform = "latest"

[tasks.lint]
description = "Lint workflows, scripts and repos configuration"
depends = ["lint:*"]

[tasks."lint:actions"]
description = "Lint GitHub workflows"
run = "jactionlint"

[tasks."lint:scripts"]
description = "Lint shell scripts"
run = "shellcheck scripts/*.sh"

[tasks."lint:repos"]
description = "Check repos formatting and validate its configuration"
dir = "repos"
run = [
  "terraform fmt -check -diff",
  "terraform init -backend=false -input=false -lockfile=readonly",
  "terraform validate",
]

[tasks."repos:init"]
description = "Initialise repos state"
dir = "repos"
run = "terraform init"

[tasks."repos:fmt"]
description = "Format repos configuration"
dir = "repos"
run = "terraform fmt"

[tasks."repos:plan"]
description = "Plan repos changes"
dir = "repos"
run = "terraform plan"

[tasks."repos:apply"]
description = "Apply repos changes"
dir = "repos"
run = "terraform apply"

[tasks."repos:adopt"]
description = "Adopt an existing repo"
dir = "repos"
run = "../scripts/adopt-repo.sh"

